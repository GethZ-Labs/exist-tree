# Netlify — free hosting (business use allowed) with the Next.js runtime: pages + /api/enquiry.
# Netlify → Add new project → Import an existing project → GitHub → pick this repo. These settings are read automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
